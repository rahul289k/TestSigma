# A run is "correct" when every invariant passes and every score below is met (`triangulate eval` reports the
# verdict). Set after the first full real run, so they guard against regressions; they are not a claim of
# absolute quality. See docs/DESIGN.md §6.
dom_code:
  route_unique_precision: 0.9   # the links the impact traversal trusts most
  overall_precision: 0.6
req_ui:
  precision: 0.75
  recall: 0.7
prs:
  max_false_alarms: 0           # per PR, against the hand-written expectations
  expected_overall_must_match: true
