# G1: DOM element -> Vue component, hand-labelled.
# Sample: 42 elements from the deterministic smoke crawl (routes / and /settings), stratified by the
# linker's method (seeded by element-id hash, so the sample is reproducible). Each label was decided by
# reading the template that renders the element in that screen state (evidence printed by
# `python -m triangulate.eval.gold_helper`), NOT by accepting the linker's answer. Keyed by route + label
# (+ context where the label repeats), so the set is reusable across runs.
- {route: /settings, label: Contact us, context: main, component: src/pages/settings.vue}
- {route: /, label: Continue with Microsoft, context: "dialog:Login to Hoppscotch", component: src/components/firebase/Login.vue}
- {route: /settings, label: Login to Hoppscotch, context: "dialog:Login to Hoppscotch", component: src/components/firebase/Login.vue}
