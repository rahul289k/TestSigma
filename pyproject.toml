[project]
name = "triangulate"
version = "0.1.0"
description = "Crawl a live app, ingest its product docs, map its code, join all three in Neo4j, and report the blast radius of a pull request."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "playwright==1.55.0",
  "neo4j==5.28.2",
  "httpx==0.28.1",
  "pydantic==2.11.9",
  "python-dotenv==1.1.1",
  "typer==0.19.2",
  "rich==14.1.0",
  "pyyaml==6.0.3",
  "markdown-it-py==4.0.0",
  "jinja2==3.1.6",
  "rank-bm25==0.2.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
triangulate = "triangulate.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triangulate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "neo4j: needs the local Neo4j server",
  "network: needs internet access",
]
